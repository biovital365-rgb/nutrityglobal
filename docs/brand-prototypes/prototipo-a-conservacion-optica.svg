<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Prototipo A — Conservación óptica de Nutrity Global</title>
  <desc id="desc">Lámina conceptual que conserva el logotipo del fundador con la y amarilla y documenta sus variantes necesarias.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#17324D" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#FBF8F1"/>
  <text x="110" y="105" fill="#17324D" font-family="Arial, sans-serif" font-size="28" font-weight="700">NUTRITY GLOBAL — PROTOTIPO A</text>
  <text x="110" y="165" fill="#17324D" font-family="Arial, sans-serif" font-size="52" font-weight="700">Conservación óptica</text>
  <text x="110" y="211" fill="#3A6447" font-family="Arial, sans-serif" font-size="24">Fidelidad al diseño recibido · ajustes de producción pendientes</text>

  <rect x="110" y="270" width="1380" height="430" rx="32" fill="#FFFFFF" filter="url(#shadow)"/>
  <image href="source/logo-nutrity-02.png" x="320" y="290" width="960" height="388" preserveAspectRatio="xMidYMid meet"/>

  <g transform="translate(110 765)">
    <rect width="425" height="150" rx="24" fill="#FFFFFF"/>
    <circle cx="48" cy="48" r="16" fill="#88B831"/>
    <text x="82" y="55" fill="#17324D" font-family="Arial, sans-serif" font-size="23" font-weight="700">Se conserva</text>
    <text x="30" y="98" fill="#3A6447" font-family="Arial, sans-serif" font-size="20">Silueta, jerarquía y “y” amarilla</text>
    <text x="30" y="126" fill="#3A6447" font-family="Arial, sans-serif" font-size="20">como gesto final de la marca.</text>
  </g>
  <g transform="translate(587 765)">
    <rect width="425" height="150" rx="24" fill="#FFFFFF"/>
    <circle cx="48" cy="48" r="16" fill="#FFCC00"/>
    <text x="82" y="55" fill="#17324D" font-family="Arial, sans-serif" font-size="23" font-weight="700">Se corrige</text>
    <text x="30" y="98" fill="#3A6447" font-family="Arial, sans-serif" font-size="20">Curvas, kerning, descriptor GLOBAL</text>
    <text x="30" y="126" fill="#3A6447" font-family="Arial, sans-serif" font-size="20">y transparencia del archivo maestro.</text>
  </g>
  <g transform="translate(1065 765)">
    <rect width="425" height="150" rx="24" fill="#17324D"/>
    <circle cx="48" cy="48" r="16" fill="#FFFFFF"/>
    <text x="82" y="55" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="23" font-weight="700">Se completa</text>
    <text x="30" y="98" fill="#E7EFE8" font-family="Arial, sans-serif" font-size="20">Versiones monocroma, negativa,</text>
    <text x="30" y="126" fill="#E7EFE8" font-family="Arial, sans-serif" font-size="20">favicon y usos compactos.</text>
  </g>
  <text x="110" y="963" fill="#6A786F" font-family="Arial, sans-serif" font-size="18">CONCEPTO PROVISIONAL · NO ES ARTE MAESTRO PARA PRODUCCIÓN</text>
</svg>
