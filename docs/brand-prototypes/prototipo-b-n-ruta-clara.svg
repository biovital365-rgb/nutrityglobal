    <text x="173" y="92" fill="#E7EFE8" font-family="Arial, sans-serif" font-size="18">Requiere variante</text>
    <text x="173" y="119" fill="#E7EFE8" font-family="Arial, sans-serif" font-size="18">negativa ajustada.</text>
