<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Prototipo B — N Ruta Clara para Nutrity Global</title>
  <desc id="desc">Lámina conceptual con un isotipo N, pasos internos y un nodo amarillo de llegada junto al wordmark Nutrity Global.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#17324D" flood-opacity="0.14"/>
    </filter>
    <g id="routeN">
