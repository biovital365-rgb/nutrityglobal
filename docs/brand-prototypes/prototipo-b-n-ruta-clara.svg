    <text x="365" y="190" text-anchor="middle" fill="#3A6447" font-family="Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="13">GLOBAL</text>
    <text x="365" y="245" text-anchor="middle" fill="#17324D" font-family="Arial, sans-serif" font-size="25">Tu próximo paso, claro y posible.</text>
  </g>

