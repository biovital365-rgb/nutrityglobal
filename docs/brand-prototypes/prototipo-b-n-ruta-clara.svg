  <rect width="1600" height="1000" fill="#FBF8F1"/>
  <text x="110" y="105" fill="#17324D" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="4">NUTRITY GLOBAL · PROTOTIPO B</text>
